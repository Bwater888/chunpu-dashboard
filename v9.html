function renderBP(){
var h='<div class=page-title>◈ 包评生成器</div><div class=card>';
h+='<div class=flex-row>';
h+='<div class=field><label>素材ID</label><input type=text id=bpCid placeholder="输入素材ID" style=width:180px></div>';
h+='<div class=field><label>产品</label><select id=bpProd><option value="">选产品</option><option>贴贴霜</option><option>泥膜</option><option>防脱</option><option>粉底液</option></select></div>';
h+='<div class=field><label>阶段</label><select id=bpStage><option>冷启动</option><option>爬坡期</option><option>爆发期</option><option>稳定期</option></select></div>';
h+='<div class=field><label>条数</label><input type=number id=bpTotal value=7 min=1 max=30 style=width:70px></div>';
h+='<div class=field><label>&nbsp;</label><button class="btn btn-p" onclick=doGenBP()>生成包评单</button></div>';
h+='</div><div class=bp-result id=bpResult></div>';
h+='<div style=margin-top:24px><div class=card-title>📁 包评历史</div><div id=bpHist class=empty-state>暂无记录</div></div></div>';
document.getElementById("view").innerHTML=h;loadBPHist();
var s=document.getElementById("bpStage");if(s)s.onchange=function(){var st={"冷启动":7,"爬坡期":9,"爆发期":11,"稳定期":7}[this.value];if(st)document.getElementById("bpTotal").value=st}
}

var _bpC=null,_bpL=false;
function loadCM(cb){if(_bpC)return cb();if(_bpL)return setTimeout(function(){loadCM(cb)},200);_bpL=true;fetch("comments.json").then(function(r){return r.json()}).then(function(j){_bpC=j.comments;cb()}).catch(function(){_bpL=false})}
function doGenBP(){loadCM(function(){var cid=document.getElementById("bpCid").value.trim(),prod=document.getElementById("bpProd").value,stage=document.getElementById("bpStage").value,total=parseInt(document.getElementById("bpTotal").value)||7;if(!cid||!prod){alert("请输入素材ID和产品");return}var cm=_bpC[prod];if(!cm){alert("该产品暂无评论");return}var all=[];Object.keys(cm).forEach(function(k){cm[k].forEach(function(c,i){all.push({code:k,text:c.text,img:c.img||"",idx:i})})});var items=all.slice(0,total);var h="<b>"+cid+" | "+prod+" | "+stage+"</b> ("+items.length+"条)";items.forEach(function(a,i){h+="<div class=bp-item><span style=width:44px;font-size:11px;color:var(--s);font-weight:600>"+a.code+"</span><span style=flex:1>"+a.text+"</span>"+(a.img?"<img class=bp-img src="+a.img+">":"")+"<button class=btn btn-o btn-xs onclick=navigator.clipboard.writeText(this.dataset.t) data-t='"+a.text.replace(/'/g,"&#39;")+"'>复制</button></div>"});var allT=items.map(function(a){return a.text}).join("\n").replace(/'/g,"&#39;");h+='<div style=margin-top:10px><button class="btn btn-p" onclick=navigator.clipboard.writeText(\''+allT+'\')>复制全部文案</button></div>';document.getElementById("bpResult").innerHTML=h})})
function loadBPHist(){try{var hl=JSON.parse(localStorage.getItem("bp_v5")||"[]"),s="";hl.slice(0,20).forEach(function(r){s+="<div class=history-item><b>"+r.cid+"</b> &nbsp; "+r.prod+" &nbsp; "+r.items.length+"条 &nbsp; <span style=color:var(--s)>"+r.time+"</span></div>"});document.getElementById("bpHist").innerHTML=s||"<div class=empty-state>暂无记录</div>"}catch(e){}}
</script></body></html>
