<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>纯朴渠道-视频号1组</title>
<style>
:root{--void:#050508;--surf:#0d0d15;--surf2:#141420;--amber:#e8a838;--phos:#4ee8a8;--coral:#f06060;--ice:#60c8f0;--txt:#e0dcd0;--dim:#6e6456;--line:#1c1c2a;--line2:#252535}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--void);color:var(--txt);font-family:"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}
.logo{position:fixed;inset:0;background:var(--void);display:flex;align-items:center;justify-content:center;z-index:999}
.lb{background:var(--surf);border:1px solid var(--line2);padding:52px 44px;width:400px;text-align:center}
.lb h2{font-size:20px;font-weight:800;letter-spacing:4px;color:var(--txt);margin-bottom:8px}
.lb p{font-size:11px;color:var(--dim);letter-spacing:4px;margin-bottom:28px}
.lb input{width:100%;padding:12px;background:var(--void);border:1px solid var(--line);font-size:18px;text-align:center;color:var(--amber);letter-spacing:6px;margin-bottom:16px}
.lb input:focus{outline:none;border-color:var(--amber)}
.lb button{display:block;width:100%;padding:12px;background:transparent;color:var(--amber);border:1px solid var(--amber);font-size:14px;font-weight:700;cursor:pointer;letter-spacing:4px}
.lb button:hover{background:rgba(232,168,56,.1)}
.lb .err{color:var(--coral);font-size:11px;min-height:18px;margin-top:-8px}
body.logged .logo{display:none}
#app{display:none}body.logged #app{display:block;padding:24px}
h1{color:var(--amber);font-size:18px;margin-bottom:16px;letter-spacing:2px}
</style>
</head>
<body>

<div class="logo">
  <div class="lb">
    <h2>纯朴渠道-视频号1组</h2>
    <p>仓盈庾亿 年岁有息</p>
    <input type="password" id="pwd" placeholder="ACCESS">
    <div class="err" id="err"></div>
    <button onclick="tryLogin()">进入</button>
  </div>
</div>

<div id="app">
  <h1>◈ 量子终端 · 综合看板</h1>
  <p style="color:var(--dim)">登录成功！开发中...</p>
</div>

<script>
function tryLogin(){
  var p=document.getElementById('pwd').value;
  if(p!=='88888888'){document.getElementById('err').textContent='ACCESS DENIED';return}
  document.body.classList.add('logged');
}
</script>

</body>
</html>
