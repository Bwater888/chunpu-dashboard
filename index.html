<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>纯朴渠道</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC",sans-serif;background:#0f1724;display:flex;align-items:center;justify-content:center;height:100vh}
.box{background:#fff;border-radius:12px;padding:40px;width:340px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.2)}
h2{font-size:20px;margin-bottom:4px}p{font-size:12px;color:#999;margin-bottom:20px}
input{width:100%;padding:10px;border:1px solid #e2e8f0;border-radius:8px;font-size:14px;margin-bottom:12px;text-align:center}
button{width:100%;padding:10px;background:#4f46e5;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
.sidebar{width:220px;background:#0f1724;color:#fff;height:100vh;display:none;flex-direction:column;position:fixed;left:0;top:0}
.main{display:none;margin-left:220px;padding:20px;background:#f5f6fa;min-height:100vh;width:100%}
</style>
</head>
<body>
<div id="loginBox" class="box">
  <h2>纯朴渠道 · 综合看板</h2>
  <p>仓盈庾亿，年岁有息</p>
  <input type="password" id="pwd" placeholder="输入密码">
  <button onclick="doLogin()">进入</button>
</div>
<div class="sidebar" id="sidebar">
  <div style="padding:20px;font-size:16px;font-weight:700;border-bottom:1px solid rgba(255,255,255,.1)">纯朴渠道</div>
  <div style="padding:12px;flex:1"><div onclick="showDash()" style="padding:10px;cursor:pointer;border-radius:6px;background:rgba(79,70,229,.25);color:#fff">📊 数据看板</div></div>
  <div style="padding:12px;font-size:11px;color:rgba(255,255,255,.3)"><a onclick="doLogout()" style="color:rgba(255,255,255,.3);cursor:pointer">退出</a></div>
</div>
<div class="main" id="main">
  <h1 id="pageTitle">数据看板</h1>
  <p id="status" style="color:#999"></p>
  <div id="content"></div>
</div>
<script>
function doLogin(){
  var p=document.getElementById('pwd').value;
  if(p!=='88888888'){alert('密码错误');return}
  document.getElementById('loginBox').style.display='none';
  document.getElementById('sidebar').style.display='flex';
  document.getElementById('main').style.display='block';
  showDash();
}
function doLogout(){
  document.getElementById('loginBox').style.display='';
  document.getElementById('sidebar').style.display='none';
  document.getElementById('main').style.display='none';
}
function showDash(){
  document.getElementById('content').innerHTML='<p>看板数据加载中...</p>';
  document.getElementById('status').textContent='在线模式';
}
</script>
</body>
</html>
