<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>纯朴渠道-视频号1组</title>
<style>

/* ====== QUANTUM TERMINAL CYBERPUNK DESIGN ====== */
:root{
  --void:#050508;--surf:#0d0d15;--surf2:#141420;
  --amber:#e8a838;--phos:#4ee8a8;--coral:#f06060;--ice:#60c8f0;--ice2:#3aa0d0;
  --txt:#e0dcd0;--dim:#6e6456;--line:#1c1c2a;--line2:#252535;
  --ff:'JetBrains Mono','Cascadia Code','Fira Code',monospace;
  --fs:11px;--fb:13px;--fh:15px;--fk:34px;
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:.2px
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--void);color:var(--txt);min-height:100vh;overflow-x:hidden}

/* ====== LOGIN ====== */
.logo{position:fixed;inset:0;background:var(--void);background-image:radial-gradient(ellipse at 50% 30%,rgba(232,168,56,.03),transparent 60%),radial-gradient(circle at 80% 60%,rgba(78,232,168,.02),transparent 40%),radial-gradient(circle,rgba(28,28,42,.8) 1px,transparent 1px);background-size:100% 100%,100% 100%,16px 16px;display:flex;align-items:center;justify-content:center;z-index:9999;overflow:hidden}
.logo::after{content:'';position:absolute;width:500px;height:500px;border:1px solid rgba(232,168,56,.06);top:50%;left:50%;transform:translate(-50%,-50%);animation:ring 10s linear infinite}
@keyframes ring{0%{transform:translate(-50%,-50%) rotate(0deg) scale(1)}50%{transform:translate(-50%,-50%) rotate(180deg) scale(1.06)}100%{transform:translate(-50%,-50%) rotate(360deg) scale(1)}}
.lb{background:var(--surf);border:1px solid var(--line2);padding:52px 44px;width:420px;text-align:center;position:relative;z-index:2}
.lb::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--amber),transparent)}
.lb h2{font-size:20px;margin-bottom:8px;font-weight:800;letter-spacing:4px;color:var(--txt);text-transform:uppercase}
.lb p{font-size:11px;color:var(--dim);margin-bottom:32px;letter-spacing:6px;font-family:var(--ff);text-transform:uppercase}
.lb input{width:100%;padding:12px;background:var(--void);border:1px solid var(--line);font-size:18px;margin-bottom:20px;text-align:center;color:var(--amber);letter-spacing:6px;font-family:var(--ff);transition:all .25s}
.lb input:focus{outline:none;border-color:var(--amber);box-shadow:inset 0 0 20px rgba(232,168,56,.05)}
.lb input::placeholder{color:rgba(110,100,86,.3);letter-spacing:4px}
.lb .btn{display:block;width:100%;padding:12px;background:transparent;color:var(--amber);border:1px solid var(--amber);font-size:14px;font-weight:700;cursor:pointer;letter-spacing:6px;font-family:var(--ff);text-transform:uppercase;transition:all .25s;position:relative;overflow:hidden}
.lb .btn:hover{background:rgba(232,168,56,.08);box-shadow:0 0 30px rgba(232,168,56,.1)}
.lb .btn::after{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(232,168,56,.1),transparent);transition:left .6s}
.lb .btn:hover::after{left:100%}
.lb .err{color:var(--coral);font-size:11px;margin-top:-12px;margin-bottom:12px;min-height:18px;font-family:var(--ff);letter-spacing:3px}

/* ====== SIDEBAR ====== */
.sb{width:224px;background:var(--surf);color:var(--txt);position:fixed;left:0;top:0;bottom:0;display:none;flex-direction:column;z-index:100;border-right:1px solid var(--line)}
.logged .sb{display:flex}
.sb-h{padding:18px;font-size:14px;font-weight:700;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;letter-spacing:2px;text-transform:uppercase;font-family:var(--ff)}
.sb-h span{background:var(--amber);color:var(--void);width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
.sb-n{flex:1;padding:10px 8px;overflow-y:auto}
.sb-n div{padding:10px 12px;cursor:pointer;font-size:12px;color:var(--dim);margin-bottom:1px;display:flex;align-items:center;gap:8px;transition:all .15s;letter-spacing:.5px;border-left:2px solid transparent}
.sb-n div:hover{background:var(--surf2);color:var(--txt);border-left-color:var(--line2)}
.sb-n div.ac{background:var(--surf2);color:var(--amber);font-weight:600;border-left-color:var(--amber)}
.sb-f{padding:12px 14px;font-size:10px;color:var(--dim);border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-family:var(--ff);letter-spacing:1px}
.sb-f a{color:var(--dim);cursor:pointer;text-decoration:none;transition:color .15s}
.sb-f a:hover{color:var(--amber)}

/* ====== MAIN ====== */
.mn{margin-left:224px;display:none;min-height:100vh;background:var(--void);background-image:radial-gradient(circle,rgba(28,28,42,.6) 1px,transparent 1px);background-size:16px 16px}
.logged .mn{display:block}
.logged .logo{display:none}
.app{display:block!important;padding:24px 28px}

/* ====== CARDS ====== */
.kpi-card,.pf-card,.ch-card,.main-panel{background:var(--surf);border:1px solid var(--line);margin-bottom:14px;transition:border-color .2s}
.kpi-card{padding:18px 20px;text-align:center}
.kpi-card:hover,.pf-card:hover,.ch-card:hover{border-color:var(--line2)}
.card{background:var(--surf);border:1px solid var(--line);padding:20px;margin-bottom:14px}
.card-title{font-size:var(--fh);font-weight:700;color:var(--txt);margin-bottom:16px;display:flex;align-items:center;gap:8px;letter-spacing:1px}
.card-title::before{content:'';width:8px;height:2px;background:var(--amber)}

/* ====== KPI ====== */
.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:18px}
.kpi-label{font-size:10px;color:var(--dim);margin-bottom:6px;font-family:var(--ff);letter-spacing:2px;text-transform:uppercase}
.kpi-value{font-size:var(--fk);font-weight:800;line-height:1.1;font-family:var(--ff);font-variant-numeric:tabular-nums}
.kpi-sub{font-size:10px;color:var(--dim);margin-top:4px;font-family:var(--ff)}
.c-spend .kpi-value{color:var(--ice)}.c-gmv .kpi-value{color:var(--phos)}
.c-roi .kpi-value{color:var(--amber)}.c-profit .kpi-value{color:var(--ice2)}
.c-margin .kpi-value{color:var(--phos)}

/* ====== PLATFORM CARDS ====== */
.pf-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.pf-card{margin-bottom:0;padding:16px 20px}
.pf-title{font-size:var(--fb);font-weight:700;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;letter-spacing:1px}
.pf-dot{width:6px;height:6px}.d-ks{background:var(--coral)}.d-sph{background:var(--ice)}
.pf-m{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;text-align:center}
.pf-ml{font-size:9px;color:var(--dim);margin-bottom:2px;font-family:var(--ff);text-transform:uppercase;letter-spacing:1px}
.pf-mv{font-size:16px;font-weight:700;font-family:var(--ff)}

/* ====== CHART CARDS ====== */
.ch-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.ch-card{margin-bottom:0;padding:16px 20px}
.ch-title{font-size:var(--fb);font-weight:700;margin-bottom:8px;color:var(--txt);letter-spacing:.5px}
.ch-wrap{height:260px}
.ch-tabs{display:flex;gap:2px;margin-bottom:8px}
.ch-tab{padding:3px 10px;font-size:10px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--dim);font-family:var(--ff);transition:all .15s;letter-spacing:1px}
.ch-tab:hover{color:var(--txt);border-color:var(--line2)}
.ch-tab.on{background:rgba(232,168,56,.12);color:var(--amber);border-color:var(--amber)}

/* ====== TABS ====== */
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tab{padding:10px 18px;cursor:pointer;font-size:var(--fb);font-weight:500;color:var(--dim);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;letter-spacing:.5px}
.tab:hover{color:var(--txt)}
.tab.on{color:var(--amber);border-bottom-color:var(--amber)}
.tab-content{padding:20px}.tab-content.on{display:block}

/* ====== FORMS ====== */
.fg input,.fg select,input[type=text],input[type=number],input[type=password],select{
  padding:8px 10px;border:1px solid var(--line);font-size:var(--fb);transition:all .15s;background:var(--void);color:var(--txt)
}
.fg input:focus,.fg select:focus,input:focus,select:focus{outline:none;border-color:var(--amber)}
.fg label,.flex-h label{font-size:10px;color:var(--dim);font-family:var(--ff);text-transform:uppercase;letter-spacing:1px}
.flex-h{display:flex;gap:14px;align-items:flex-end;background:var(--surf2);padding:14px 18px;margin-bottom:14px;border:1px solid var(--line)}
.fg input[readonly]{background:var(--surf2);color:var(--amber);font-weight:700}

/* ====== BUTTONS ====== */
.btn{padding:7px 14px;border:1px solid var(--line);cursor:pointer;font-size:11px;font-weight:600;transition:all .15s;display:inline-flex;align-items:center;gap:4px;letter-spacing:.5px;background:transparent;color:var(--txt)}
.btn:hover{border-color:var(--amber);color:var(--amber)}
.btn-primary{background:rgba(232,168,56,.1);color:var(--amber);border-color:var(--amber)}.btn-primary:hover{background:rgba(232,168,56,.2)}
.btn-outline{color:var(--ice);border-color:var(--ice)}.btn-outline:hover{background:rgba(96,200,240,.08)}
.btn-del{color:var(--coral);border-color:var(--coral)}.btn-del:hover{background:rgba(240,96,96,.1)}
.btn-xs{padding:3px 8px;font-size:10px}
.btn-xa{color:var(--ice);border-color:var(--ice)}.btn-xd{color:var(--coral);border-color:var(--coral)}.btn-xg{color:var(--phos);border-color:var(--phos)}

/* ====== TABLE ====== */
table{width:100%;border-collapse:collapse;font-size:11px}
th{background:var(--surf2);font-weight:600;color:var(--dim);padding:8px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;font-size:10px;font-family:var(--ff);text-transform:uppercase;letter-spacing:1px}
td{padding:7px 10px;border-bottom:1px solid var(--line);font-size:11px;color:var(--txt)}
tr:nth-child(even) td{background:rgba(20,20,32,.3)}
tr:hover td{background:rgba(232,168,56,.04)}
.ar{text-align:right;font-family:var(--ff);font-variant-numeric:tabular-nums}.ac{text-align:center}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line)}

/* ====== TAGS ====== */
.tag{display:inline-block;padding:1px 6px;font-size:9px;margin-left:3px;font-weight:600;font-family:var(--ff);letter-spacing:.5px}
.tag-sph{color:var(--ice)}.tag-ks{color:var(--coral)}
.tag-s{background:rgba(96,200,240,.08);color:var(--ice)}.tag-k{background:rgba(240,96,96,.08);color:var(--coral)}

/* ====== SECTIONS ====== */
.section{border:1px solid var(--line);margin-bottom:12px}
.sec-hdr{padding:10px 16px;background:var(--surf2);cursor:pointer;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px;color:var(--txt);letter-spacing:.5px}
.sec-body{padding:14px 16px}
.sec-result{background:rgba(78,232,168,.04);padding:8px 12px;font-size:10px;display:flex;gap:14px;flex-wrap:wrap;font-family:var(--ff)}
.sec-result strong{color:var(--phos)}

/* ====== HELPERS ====== */
.container{max-width:1440px;margin:0 auto}
.empty{text-align:center;padding:40px;color:var(--dim);font-size:12px;font-family:var(--ff)}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:10px 20px;font-size:12px;z-index:999;border:1px solid;font-weight:600;font-family:var(--ff);letter-spacing:1px}
.toast.ok{border-color:var(--phos);color:var(--phos);background:rgba(78,232,168,.05)}
.toast.err{border-color:var(--coral);color:var(--coral);background:rgba(240,96,96,.05)}
.cr{color:var(--ice)}.cg{color:var(--phos)}.cb{color:var(--amber)}.cp{color:var(--ice2)}.co{color:var(--phos)}

/* ====== BP MODULE ====== */
.bp-r{padding:5px 0;border-bottom:1px solid var(--line);font-size:12px;display:flex;align-items:center;gap:8px}.bp-r:last-child{border-bottom:none}
.bp-img{width:28px;height:28px;object-fit:cover;border:1px solid var(--line)}
.hi{background:var(--surf2);padding:10px;margin-bottom:6px;border:1px solid var(--line);transition:border-color .15s}.hi:hover{border-color:var(--line2)}
.t1{background:rgba(240,96,96,.1);color:var(--coral)}.t2{background:rgba(232,168,56,.1);color:var(--amber)}.t3{background:rgba(96,200,240,.1);color:var(--ice)}
.product-table th{background:rgba(96,200,240,.06);color:var(--ice)}
.header{display:none!important}

</style>
</head><body>

<div class="logo" id="loginBox"><div class="lb">
<h2>纯朴渠道-视频号1组</h2><p>仓盈庾亿，年岁有息</p>
<input type="password" id="pwd" placeholder="ACCESS CODE" onkeydown="if(event.key==='Enter')doLogin()">
<div class="err" id="loginErr"></div>
<button class="btn" onclick="doLogin()">进入</button>
</div></div>

<div class="sb" id="sidebar">
<div class="sb-h"><span>纯</span>纯朴渠道</div>
<div class="sb-n">
<div onclick="navShell('entry')" data-nav="entry" class="ac">📝 数据录入</div>
<div onclick="navShell('table')" data-nav="table">📋 数据明细</div>
<div onclick="navShell('psum')" data-nav="psum">📊 产品汇总</div>
<div onclick="navShell('pchart')" data-nav="pchart">📈 产品分析</div>
<div onclick="navShell('targets')" data-nav="targets">🎯 目标看板</div>
<div onclick="navShell('bp')" data-nav="bp">💬 包评生成</div>
<div onclick="navShell('settings')" data-nav="settings">⚙️ 参数设置</div>
</div>
<div class="sb-f"><span id="syncTime">--</span><a onclick="doRefresh()">🔄 刷新</a><a onclick="doLogout()">退出</a></div>
</div>

<div class="mn" id="main">
<div class="app">
<div id="dash-wrap">
<div id="loader" class="loader" style="display:none"><div class="spin"></div></div>

<div class="header">
  <h1>纯朴渠道部门-视频号1组（仓盈庾亿，年岁有息）</h1>
  <div class="header-r" id="hdrStatus">本地模式</div>
  <button class="btn btn-xs" style="background:transparent;color:#fff;border:1px solid rgba(255,255,255,.3);padding:3px 8px;font-size:10px;margin-left:8px" onclick="doAdmin();refresh()">👑 管理</button>
</div>

<div class="container">
  <div id="kpiCards"></div>
  <div class="pf-row" id="pfCards"></div>
  <div class="ch-row">
    <div class="ch-card">
      <div class="ch-tabs" id="chTabs1"></div>
      <div class="ch-wrap"><canvas id="chSG"></canvas></div>
    </div>
    <div class="ch-card">
      <div class="ch-tabs" id="chTabs2"></div>
      <div class="ch-wrap"><canvas id="chRP"></canvas></div>
    </div>
  </div>

  <div class="main-panel">
    <div class="tabs">
      <div class="tab on" onclick="swTab('entry')">数据录入</div>
      <div class="tab" onclick="swTab('table')">数据明细</div>
      <div class="tab" onclick="swTab('psum')">产品汇总</div>
      <div class="tab" onclick="swTab('pchart')">产品分析</div>
      <div class="tab" onclick="swTab('targets')">目标看板</div>
      <div class="tab" onclick="swTab('settings')">参数</div>
    </div>

    <div class="tab-content on" id="tc-entry">
      <div class="flex-h">
        <div class="fg"><label>日期</label><input type="date" id="ipDate"></div>
        <div class="fg"><label>平台</label><select id="ipPlatform" onchange="makeForm()"><option value="视频号">视频号</option><option value="快手">快手</option></select></div>
        <div class="fg"><label>产品</label><select id="ipProduct" onchange="renderEntryForm();autoCalc()"></select></div>
      </div>
      <div id="entryForm"></div>
      <div id="calcBox"></div>
      <div style="margin-top:8px"><button class="btn btn-primary" onclick="doAdd()" id="btnAdd">保存数据</button> <span style="font-size:11px;color:#52c41a;margin-left:8px" id="lblSave"></span></div>
      <div style="margin-top:16px"><b style="font-size:13px">今日已录入</b> <span id="todaySum" style="font-size:11px;color:#999"></span>
        <div class="tbl-wrap"><table id="tblToday"><thead></thead><tbody></tbody></table></div>
      </div>
    </div>

    <div class="tab-content" id="tc-table">
      <div class="flt-row">
        <div class="fg"><label>开始</label><input type="date" id="fs"></div>
        <div class="fg"><label>结束</label><input type="date" id="fe"></div>
        <div class="fg"><label>平台</label><select id="fp"><option value="全部">全部</option><option value="视频号">视频号</option><option value="快手">快手</option></select></div>
        <div class="fg"><label>产品</label><select id="fpr"><option value="全部">全部</option></select></div>
        <button class="btn btn-outline" style="background:#fff;color:#666;border-color:#d9d9d9;font-size:11px" onclick="doClear()">清空数据</button>
      </div>
      <div class="tbl-wrap"><table id="tblData"><thead></thead><tbody></tbody></table></div>
    </div>

    <div class="tab-content" id="tc-psum"><div id="psumCtn"></div></div>
    <div class="tab-content" id="tc-pchart"><div id="pchartCtn"></div></div>
    <div class="tab-content" id="tc-targets"><div id="targetCtn"></div></div>

    <div class="tab-content" id="tc-settings">
      <div class="set-grid">
        <div class="set-block"><h4>佣金率 (%)</h4><div id="setComm"></div></div>
        <div class="set-block"><h4>退货率 (%)</h4><div id="setRet"></div></div>
      </div>
      <div style="margin-top:12px;padding-top:10px;border-top:1px solid #f0f0f0">
        <div style="font-size:11px;color:#999;margin:4px 0 2px;font-weight:600">ADQ返点系数（视频号各品）</div>
        <div id="setAdqCtn"></div>
        <div style="font-size:11px;color:#999;margin:12px 0 2px;font-weight:600">快手返点</div>
        <div class="set-item"><span>快手返点</span><div><input type="number" id="setKs" step="0.1" min="0" max="100"> %</div></div>
      </div>
      <div style="margin-top:12px"><button class="btn btn-primary" onclick="doSaveSet()">保存参数</button> <button class="btn btn-outline" style="background:#fff;color:#999;border-color:#d9d9d9" onclick="doResetSet()">重置</button></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

</div>
<!-- BP Panel -->
<div id="tc-bp" style="display:none">
<div class="card"><div class="card-title">💬 包评生成器</div>
<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0">
<label>素材ID</label><input type="text" id="bpCid" placeholder="输入素材ID" style="width:160px;padding:6px;border:1px solid #ddd;border-radius:6px">
<label>产品</label><select id="bpProd" style="padding:6px;border:1px solid #ddd;border-radius:6px"><option value="">选产品</option><option>贴贴霜</option><option>泥膜</option><option>防脱</option><option>粉底液</option></select>
<label>阶段</label><select id="bpStage" style="padding:6px;border:1px solid #ddd;border-radius:6px"><option>冷启动</option><option>爬坡期</option><option>爆发期</option><option>稳定期</option></select>
</div>
<div style="display:flex;gap:10px;align-items:center;margin-bottom:10px">
<label>总条数</label><input type="number" id="bpTotal" value="7" min="1" max="30" style="width:70px;padding:6px;border:1px solid #ddd;border-radius:6px">
<button class="btn btn-primary" onclick="doGenBP()" style="padding:6px 16px;background:#534AB7;color:#fff;border:none;border-radius:6px;cursor:pointer">生成包评单</button>
</div>
<div id="bpResult"></div>
<div id="bpStatus" style="font-size:11px;color:#999;margin-top:4px"></div>
</div>
<div class="card" style="margin-top:16px"><div class="card-title">📁 包评历史 <span style="font-size:12px;color:#999;font-weight:400;margin-left:8px" id="bpHistCnt"></span></div>
<div style="display:flex;gap:8px;margin-bottom:10px"><input type="text" id="bpHistSearch" placeholder="搜索素材ID或产品" style="flex:1;max-width:300px;padding:5px 8px;border:1px solid #ddd;border-radius:6px;font-size:12px" oninput="renderBPHist()"><button style="padding:5px 10px;font-size:11px;border:1px solid #ddd;border-radius:6px;cursor:pointer;background:#fff" onclick="document.getElementById('bpHistSearch').value='';renderBPHist()">清除</button></div>
<div id="bpHist"></div></div>
</div>
</div>
</div>

<script>
// ====== AUTH ======

// ===================== 计算引擎 =====================
function cr(pl,pr){return((PARAM.commission[pl]||{})[pr]||0)/100}
function rr(pl,pr){return((PARAM.returnRate[pl]||{})[pr]||0)/100}

function calc(m){
  if(m.platform==='快手'){
    m.总消耗=m.spend||0;m.真实成交=m.gmv||0;
    const actualSpend=m.总消耗/(1+(PARAM.ksRebate||0.10));
    m.总ROI=actualSpend>0?m.gmv/actualSpend:0;
    m.利润=m.gmv*m.commissionRate*(1-m.returnRate)-actualSpend;
    m.利润率=m.真实成交>0?m.利润/m.真实成交:0;
    return;
  }
  m.真实成交=((m.总成交金额||0)-(m.补单金额||0)-(m.达人带货金额||0))*(1-m.returnRate);
  m.微信豆实际消耗=(m.微信豆消耗||0)-(m.微信豆付款流量券||0)+(m.微信豆退款流量券||0);
  m.微信豆ROI=m.微信豆实际消耗>0?(m.微信豆GMV||0)/m.微信豆实际消耗:0;
  m.长期计划ROI=(m.长期消耗||0)>0?(m.长期GMV||0)/m.长期消耗:0;
  m.小店加热实际消耗=(m.小店加热消耗||0)-(m.小店加热付款流量券||0)+(m.小店加热退款流量券||0);
  m.小店加热ROI=m.小店加热实际消耗>0?(m.小店加热GMV||0)/m.小店加热实际消耗:0;
  m.小店投放ROI=(m.小店投放消耗||0)>0?(m.小店投放GMV||0)/m.小店投放消耗:0;
  const rebate=((PARAM.adqRebate||DEF_PARAMS.adqRebate)[m.product]||1.0325);
  m.ADQ真实消耗=(m.ADQ消耗||0)/rebate;
  m.ADQ_ROI=m.ADQ真实消耗>0?(m.ADQ_GMV||0)/m.ADQ真实消耗:0;
  m.总消耗=m.微信豆实际消耗+(m.长期消耗||0)+m.小店加热实际消耗+m.ADQ真实消耗+(m.小店投放消耗||0);
  m.总ROI=m.总消耗>0?(m.总成交金额||0)/m.总消耗:0;
  m.利润=m.真实成交*m.commissionRate-m.总消耗;
  m.利润率=m.真实成交>0?m.利润/m.真实成交:0;
}

function agg(arr){
  let s=0,g=0,p=0,z=0,td=0,adq=0,wx=0,jr=0,jrs=0,wxs=0,cq=0;
  arr.forEach(d=>{s+=d.总消耗||0;g+=d.总成交金额||d.gmv||0;p+=d.利润||0;z+=d.真实成交||0;
    td+=d.小店投放消耗||0;adq+=d.ADQ消耗||0;wx+=d.微信豆消耗||0;jr+=d.小店加热消耗||0;
    jrs+=d.小店加热实际消耗||0;wxs+=d.微信豆实际消耗||0;cq+=d.长期消耗||0});
  return{总消耗:s,总成交金额:g,总ROI:s>0?g/s:0,总利润:p,真实成交:z,利润率:z>0?p/z:0,
    小店投放消耗:td,ADQ消耗:adq,微信豆消耗:wx,小店加热消耗:jr,小店加热实际消耗:jrs,微信豆实际消耗:wxs,长期消耗:cq};
}

function autoCalc(){
  try{
  const pl=document.getElementById('ipPlatform')?.value||'视频号';
  const pr=document.getElementById('ipProduct')?.value;
  const cm=cr(pl,pr),rm=rr(pl,pr);
  svl('fv_佣金率',cm*100);svl('fv_退货率',rm*100);

  if(pl==='视频号'){
    const sc=getStoreCfg(pr);const m={platform:pl,product:pr,commissionRate:cm,returnRate:rm,
      总成交金额:sc?sc.slice(0,sc[6].length*2).filter((_,i)=>i%2===0).reduce((a,k)=>a+(gv('fi_'+k)||0),0):gv('fi_总成交金额'),补单金额:gv('fi_补单金额'),达人带货金额:sc?sc.slice(0,sc[6].length*2).filter((_,i)=>i%2===1).reduce((a,k)=>a+(gv('fi_'+k)||0),0):gv('fi_达人带货金额'),
      ...(sc?Object.fromEntries(sc.slice(0,sc[6].length*2).map(k=>[k,gv('fi_'+k)||0])):{}),
      昨退货率:gv('fi_昨退货率'),近7天退货率:gv('fi_近7天退货率'),近30天退货率:gv('fi_近30天退货率'),当月退货率:gv('fi_当月退货率'),
      微信豆GMV:gv('fi_微信豆GMV'),微信豆消耗:gv('fi_微信豆消耗'),微信豆付款流量券:gv('fi_微信豆付款流量券'),微信豆退款流量券:gv('fi_微信豆退款流量券'),
      长期消耗:gv('fi_长期消耗'),长期GMV:gv('fi_长期GMV'),
      小店加热GMV:gv('fi_小店加热GMV'),小店加热消耗:gv('fi_小店加热消耗'),小店加热付款流量券:gv('fi_小店加热付款流量券'),小店加热退款流量券:gv('fi_小店加热退款流量券'),
      小店投放GMV:gv('fi_小店投放GMV'),小店投放消耗:gv('fi_小店投放消耗'),ADQ消耗:gv('fi_ADQ消耗'),ADQ_GMV:gv('fi_ADQ_GMV'),
      微信豆预期赔付券:gv('fi_微信豆预期赔付券'),小店加热预期赔付券:gv('fi_小店加热预期赔付券'),
      微信豆ROI出价:gv('fi_微信豆ROI出价'),微信豆成交出价:gv('fi_微信豆成交出价'),小店加热ROI出价:gv('fi_小店加热ROI出价'),小店加热成交出价:gv('fi_小店加热成交出价'),ADQROI出价:gv('fi_ADQROI出价'),ADQ成交出价:gv('fi_ADQ成交出价')};
    calc(m);
    svl('fv_真实成交',m.真实成交);svl('fv_微信豆实际消耗',m.微信豆实际消耗);    svl('fv_微信豆ROI',m.微信豆ROI);
    const pcWx=gv('fi_微信豆预期赔付券'),pcJr=gv('fi_小店加热预期赔付券');
    const wxRaw=gv('fi_微信豆消耗'),jrRaw=gv('fi_小店加热消耗');
    const wxDsp=wxRaw-pcWx,jrDsp=jrRaw-pcJr;
    svl('fv_微信豆扣赔付消耗',wxDsp);svl('fv_微信豆赔付ROI',wxDsp>0?(m.微信豆GMV||0)/wxDsp:0);
    svl('fv_长期计划ROI',m.长期计划ROI);svl('fv_小店加热实际消耗',m.小店加热实际消耗);svl('fv_小店加热ROI',m.小店加热ROI);
    svl('fv_小店加热扣赔付消耗',jrDsp);svl('fv_小店加热赔付ROI',jrDsp>0?(m.小店加热GMV||0)/jrDsp:0);
    const wxNetGMV=(m.微信豆GMV||0)*cm*(1-rm),jrNetGMV=(m.小店加热GMV||0)*cm*(1-rm);
    svl('fv_微信豆财务利润',wxNetGMV-m.微信豆实际消耗);svl('fv_微信豆投放利润',wxNetGMV-wxDsp);
    svl('fv_小店加热财务利润',jrNetGMV-m.小店加热实际消耗);svl('fv_小店加热投放利润',jrNetGMV-jrDsp);
    svl('fv_小店投放ROI',m.小店投放ROI);svl('fv_ADQ真实消耗',m.ADQ真实消耗);svl('fv_ADQ_ROI',m.ADQ_ROI);
    try{
    const adqPr=document.getElementById('ipProduct')?.value||'贴贴霜';
    const adqComm=((PARAM.commission||DEF_PARAMS.commission).视频号||{})[adqPr]||70;
    const adqRt=((PARAM.returnRate||DEF_PARAMS.returnRate).视频号||{})[adqPr]||20;
    const adqNetGMV=(m.ADQ_GMV||0)*adqComm/100*(1-adqRt/100);
    svl('fv_ADQ净投产',gv('fi_ADQ净投产'));svl('fv_ADQ利润',adqNetGMV-m.ADQ真实消耗);
    }catch(e){}
    svl('fv_总消耗',m.总消耗);svl('fv_总ROI',m.总ROI);svl('fv_利润',m.利润);svl('fv_利润率',m.利润率*100);
  } else {
    const s=gv('fi_ksSpend'),g=gv('fi_ksGmv');
    const p=g*cm*(1-rm)-s;
    svl('fv_总ROI',s>0?g/s:0);svl('fv_利润',p);svl('fv_利润率',g>0?p/g*100:0);
  }
  }catch(e){console.error('autoCalc error:',e.message)}
}

    m.ADQ净投产=gv('fi_ADQ净投产');

function renderPchart(){
  const now=new Date();
  const ct=document.getElementById('pchartCtn');

  // 辅助：根据给定范围生成 {sd,ed}
  function getDR(range){
    let start;
    if(range==='month'){start=new Date(now.getFullYear(),now.getMonth(),1)}
    else if(range==='custom'){
      if(_custSD&&_custED)return{sd:_custSD,ed:_custED}
      start=new Date(now.getTime()-30*86400000);
    }
    else{start=new Date(now.getTime()-parseInt(range)*86400000)}
    return{sd:start.toISOString().split('T')[0],ed:(range==='custom'&&_custED)?_custED:now.toISOString().split('T')[0]};
  }

  const sph=DB.filter(d=>d.platform==='视频号'),ks=DB.filter(d=>d.platform==='快手');

  function rt4(arr){const ds=Object.keys(Object.groupBy?Object.groupBy(arr,d=>d.date):arr.reduce((o,d)=>{if(!o[d.date])o[d.date]=[];o[d.date].push(d);return o},{})).map(k=>arr.find(d=>d.date===k)).filter(Boolean).sort((a,b)=>a.date>b.date?1:-1);return{ds:ds.map(d=>d.date),y:ds.map(d=>d.昨退货率||0),w:ds.map(d=>d.近7天退货率||0),d30:ds.map(d=>d.近30天退货率||0),m:ds.map(d=>d.当月退货率||0)};}
  function rt4a(arr){const ds={};arr.forEach(d=>{if(!ds[d.date])ds[d.date]=d;});const keys=Object.keys(ds).sort();return{ds:keys,y:keys.map(k=>ds[k].昨退货率||0),w:keys.map(k=>ds[k].近7天退货率||0),d30:keys.map(k=>ds[k].近30天退货率||0),m:keys.map(k=>ds[k].当月退货率||0)};}

  function gsWxStore(arr){const dm={};arr.forEach(d=>{if(!dm[d.date])dm[d.date]={s:0,g:0};dm[d.date].s+=(d.微信豆实际消耗||0)+(d.小店加热实际消耗||0)+(d.长期消耗||0);dm[d.date].g+=(d.微信豆GMV||0)+(d.小店加热GMV||0)+(d.长期GMV||0)});const ds=Object.keys(dm).sort();return{ds,s:ds.map(d=>dm[d].s),g:ds.map(d=>dm[d].g),r:ds.map(d=>dm[d].s>0?dm[d].g/dm[d].s:0)};}

  function makeTabs(pr,cur){

    const d7avg=last7.length>0?d7sum/last7.length:0;
    const remainDays=totalDays-elapsed;
    const predict=actual+d7avg*remainDays;
    const predPct=tgt>0?Math.min(100,predict/tgt*100):0;
    const real=pd.reduce((s,d)=>s+(d.真实成交||0),0);
    const margin=real>0?actual/real*100:0;
    const pct=tgt>0?Math.min(100,actual/tgt*100):0;
    const mrPct=Math.min(100,margin/tgtMr*100);
    const gap=tgt-actual;
    const colors=[
      {grad:'linear-gradient(135deg,#667eea,#9b6dff)',hex:'#667eea',accent:'#d6d8ff'},
      {grad:'linear-gradient(135deg,#20C997,#38d9a9)',hex:'#20C997',accent:'#c2f0e2'},
      {grad:'linear-gradient(135deg,#F59E0B,#ffc53d)',hex:'#F59E0B',accent:'#ffe8b3'},
      {grad:'linear-gradient(135deg,#FF6B6B,#ff8c8c)',hex:'#FF6B6B',accent:'#ffcccc'}
    ];
    const ci=prods.indexOf(pr);
    const lk=isLocked(pr);
    const c=colors[ci];
    h+=`<div style="background:#fff;border-radius:10px;border:1px solid #f0f0f0;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06)">
      <div style="background:${c.grad};color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center">
        <div>
          <div style="font-size:15px;font-weight:700">${pr}</div>
          <div style="font-size:10px;opacity:.75">月利润目标 ¥${(tgt/1e4).toFixed(0)}万</div>
        </div>
        <div style="font-size:12px;cursor:pointer;opacity:.8;padding:2px 4px" onclick="event.stopPropagation();editTarget('${pr}')" title="调整目标">⚙</div>
      </div>
      <div style="padding:12px 14px">${lk?`
        <div style="text-align:center;padding:20px 0;color:#bfbfbf;font-size:14px">🔒 无权限</div>`:`
        <div style="display:flex;justify-content:space-between;align-items:last-baseline;margin-bottom:4px">
          <div style="font-size:26px;font-weight:800;color:${pct>=80?'#10B981':pct>=50?'#F59E0B':'#ff4d4f'};line-height:1">¥${(actual/1e4).toFixed(1)}<span style="font-size:14px;font-weight:600">万</span></div>
          <div style="text-align:right;line-height:1.2">
            <div style="font-size:10px;color:#bbb">缺口</div>
            <div style="font-size:15px;font-weight:700;color:${gap<=0?'#10B981':'#ff4d4f'}">${gap<=0?'✅ 已达标':'¥'+(gap/1e4).toFixed(1)+'万'}</div>
          </div>
        </div>
        <div style="margin-bottom:10px;position:relative">
          <div style="display:flex;justify-content:space-between;font-size:10px;color:#bbb;margin-bottom:2px"><span>利润</span><span>${pct.toFixed(0)}%</span></div>
          <div style="background:#f0f0f0;border-radius:10px;height:8px;overflow:hidden">
            <div style="height:100%;border-radius:10px;background:${pct>=80?'linear-gradient(90deg,#20C997,#38d9a9)':pct>=50?'linear-gradient(90deg,#F59E0B,#ffc53d)':'linear-gradient(90deg,#FF6B6B,#ff8c8c)'};width:${pct}%;transition:width .5s"></div>
          </div>
        </div>
        <div style="border-top:1px dashed #eee;padding-top:10px;position:relative">
          <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px">
            <span style="font-size:10px;color:#999">利润率</span>
            <span style="font-size:18px;font-weight:900;color:${margin>=tgtMr?'#10B981':'#ff4d4f'}">${margin.toFixed(1)}%</span>
            <span style="font-size:10px;color:#ccc">/ 目标 ${tgtMr}%</span>
          </div>
          <div style="background:#f0f0f0;border-radius:10px;height:8px;overflow:hidden">
            <div style="height:100%;border-radius:10px;background:${margin>=tgtMr?'linear-gradient(90deg,#20C997,#38d9a9)':'linear-gradient(90deg,#FF6B6B,#ff8c8c)'};width:${mrPct}%;transition:width .5s"></div>
          </div>
        </div>
        <div style="border-top:1px dashed #eee;padding-top:10px;margin-top:8px">
          <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px">
            <span style="font-size:10px;color:#999">7日均利润 ¥${(d7avg/1e4).toFixed(1)}万 → 月底预估</span>
            <span style="font-size:14px;font-weight:800;color:${predict>=tgt?'#10B981':predict>=tgt*0.8?'#F59E0B':'#ff4d4f'}">¥${(predict/1e4).toFixed(1)}万</span>
          </div>
          <div style="background:#f0f0f0;border-radius:10px;height:8px;overflow:hidden">
            <div style="height:100%;border-radius:10px;background:${predPct>=100?'linear-gradient(90deg,#20C997,#38d9a9)':predPct>=80?'linear-gradient(90deg,#F59E0B,#ffc53d)':'linear-gradient(90deg,#FF6B6B,#ff8c8c)'};width:${predPct}%;transition:width .5s"></div>
          </div>
          <div style="display:flex;justify-content:space-between;margin-top:3px;font-size:10px;color:#bbb">
            <span>vs 目标 ¥${(tgt/1e4).toFixed(0)}万</span><span>${predict>=tgt?'✅ 可达标':'差 ¥'+((tgt-predict)/1e4).toFixed(1)+'万'}</span>
          </div>
        </div>`}
      </div>
    </div>`;
  });
  h+=`</div>`;
  document.getElementById('targetCtn').innerHTML=h;
}

function editTarget(pr){
  const goal=PARAM.monthlyGoal||DEF_PARAMS.monthlyGoal;
  const cur=(goal.profit[pr]||0)/1e4;
  const inp=prompt(pr+' 月度利润目标（万元）',cur);
  if(inp===null)return;
  const v=parseFloat(inp);
  if(isNaN(v)||v<=0){toast('请输入有效数字',true);return}
  if(!PARAM.monthlyGoal)PARAM.monthlyGoal=JSON.parse(JSON.stringify(DEF_PARAMS.monthlyGoal));
  PARAM.monthlyGoal.profit[pr]=Math.round(v*10000);
  sp();
  renderTargets();
  toast(pr+' 目标已更新');
}

function swTab(n){

  renderKPI();renderCharts();renderToday();renderTable()
}

/* ====== BP MODULE ====== */
function renderBP(){
  document.querySelectorAll('.sb-n div[data-nav]').forEach(function(d){d.classList.toggle('ac',d.dataset.nav==='bp')});
  var s=document.getElementById("bpStage");if(s)s.onchange=function(){var st=_bpStages[this.value];if(st)document.getElementById("bpTotal").value=st.t};
  renderBPHist();
}
function doGenBP(){
  if(!_bpComments){alert("评论库未加载，请刷新");return}
  var cid=document.getElementById("bpCid").value.trim();
  var prod=document.getElementById("bpProd").value;
  var stage=document.getElementById("bpStage").value;
  var total=parseInt(document.getElementById("bpTotal").value)||7;
  if(!cid||!prod){alert("请输入素材ID和产品");return}
  var cm=_bpComments[prod];if(!cm){alert("该产品暂无评论");return}
  var st=_bpStages[stage]||_bpStages.冷启动;
  var all=[];Object.keys(cm).forEach(function(k){all.push({code:k,cmts:cm[k],prio:cm[k][0].prio})});
  all.sort(function(a,b){return a.prio.localeCompare(b.prio)});
  var ts={1:[],2:[],3:[],4:[]};all.forEach(function(s){ts[parseInt(s.prio.split(" ")[0])].push(s)});
  var al=[];
  function fl(l,c){if(!l||l.length===0)return;var p=Math.floor(c/l.length),r=c%l.length;l.forEach(function(s,i){var n=i<r?p+1:p;for(var j=0;j<n&&j<s.cmts.length;j++)al.push({code:s.code,text:s.cmts[j].text,prio:s.prio,idx:j,img:s.cmts[j].img||""})})}
  fl(ts[1],Math.round(total*st.t1));fl(ts[2],Math.round(total*st.t2));fl(ts[3],Math.round(total*st.t3));
  var l4=total-Math.round(total*st.t1)-Math.round(total*st.t2)-Math.round(total*st.t3);fl(ts[4],l4);
  var hist=window._bpHist||[],used=[];
  hist.forEach(function(r){if(r.cid===cid)r.items.forEach(function(x){used.push(x.text)})});
  al.forEach(function(a){if(used.indexOf(a.text)>=0){var c=cm[a.code];for(var k=0;k<c.length;k++){if(used.indexOf(c[k].text)<0){a.text=c[k].text;a.idx=k;a.img=c[k].img||"";break}}}used.push(a.text)});
  var items=al.map(function(a){return{code:a.code,text:a.text,prio:a.prio,idx:a.idx,img:a.img}});
  var h="<div style=margin-top:12px><b>素材 "+cid+" | "+prod+" | "+stage+"</b> <span style=color:#999;font-size:12px>"+items.length+"条</span>";
  items.forEach(function(a,i){{var t=parseInt(a.prio.split(" ")[0]),cls="t"+t;h+="<div class=bp-r><span style=width:36px;font-size:10px;color:#999>"+a.code+"</span><span class=\""+cls+"\" style=font-size:9px;padding:1px 6px;border-radius:3px;font-weight:600>"+a.prio.split(" ").slice(1).join(" ")+"</span><span style=flex:1>"+a.text+"</span>";if(a.img)h+="<img class=bp-img src="+(a.img.indexOf("http")===0?a.img:"images/"+a.img)+" onerror=this.style.display=none>";h+="<button style=padding:3px 8px;background:#534AB7;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:10px onclick=cpBPItem("+i+")>复制</button></div>"}});
  h+="<div style=margin-top:8px><button style=padding:6px 14px;background:#e8e8e8;color:#534AB7;border:none;border-radius:6px;cursor:pointer onclick=cpBPAll()>复制全部文案</button> <button style=padding:6px 14px;background:#534AB7;color:#fff;border:none;border-radius:6px;cursor:pointer onclick=saveBP('"+cid+"','"+prod+"','"+stage+"')>保存到历史</button></div></div>";
  document.getElementById("bpResult").innerHTML=h;window._bpi=items;window._bpc=cid;window._bpp=prod;window._bps=stage;saveBP(cid,prod,stage);
}
function cpBPItem(i){var a=window._bpi[i];if(!a)return;var d=document.createElement("div");d.contentEditable=true;d.style.position="fixed";d.style.left="-9999px";if(a.img)d.innerHTML=a.text+"<br><img src="+(a.img.indexOf("http")===0?a.img:"images/"+a.img)+" style=max-width:300px>";else d.textContent=a.text;document.body.appendChild(d);var r=document.createRange();r.selectNodeContents(d);var s=window.getSelection();s.removeAllRanges();s.addRange(r);document.execCommand("copy");s.removeAllRanges();document.body.removeChild(d)}
function cpBPAll(){if(!window._bpi)return;var t=window._bpi.map(function(a){return a.text}).join("\n");navigator.clipboard.writeText(t)}
function saveBP(cid,prod,stage){if(!window._bpi)return;var e={cid:cid,prod:prod,stage:stage,time:new Date().toLocaleString("zh-CN"),items:window._bpi};var h=window._bpHist||[],x=-1;for(var i=0;i<h.length;i++){if(h[i].cid===e.cid){x=i;break}}if(x>=0)h[x]=e;else h.unshift(e);if(h.length>200)h=h.slice(0,200);window._bpHist=h;localStorage.setItem("bp_v5",JSON.stringify(h));renderBPHist()}
function renderBPHist(){
  var h=window._bpHist||[],s="",kw="";
  var si=document.getElementById("bpHistSearch");if(si)kw=si.value.trim().toLowerCase();
  var cnt=document.getElementById("bpHistCnt");if(cnt)cnt.textContent="("+h.length+"条)";
  var filtered=kw?h.filter(function(r){return r.cid.toLowerCase().indexOf(kw)>=0||r.prod.indexOf(kw)>=0}):h;
  if(filtered.length===0)s="<div style=color:#999;text-align:center;padding:20px>"+(kw?"无匹配结果":"暂无记录")+"</div>";
  else filtered.forEach(function(r,fi){var oi=h.indexOf(r);s+="<div class=hi><div style=display:flex;justify-content:space-between><b>"+r.cid+"</b><span style=font-size:10px;color:#999>"+r.time+"</span></div><div style=font-size:11px;color:#999>"+r.prod+" | "+r.stage+" | "+r.items.length+"条</div><div style=font-size:11px;color:#666;overflow:hidden;white-space:nowrap;text-overflow:ellipsis>"+r.items.map(function(t){return t.text}).join(" | ")+"</div><div style=margin-top:4px><button style=font-size:10px;padding:2px 8px;background:#534AB7;color:#fff;border:none;border-radius:3px;cursor:pointer onclick=togBPD("+oi+")>详情</button> <button style=font-size:10px;padding:2px 8px;background:#ff4d4f;color:#fff;border:none;border-radius:3px;cursor:pointer onclick=delBPR("+oi+")>删除</button></div><div id=bpd_"+oi+" style=display:none;margin-top:6px;padding:8px;background:#fff;border-radius:6px></div></div>"});
  document.getElementById("bpHist").innerHTML=s;
}
function togBPD(i){var d=document.getElementById("bpd_"+i);if(d.style.display==="none"){var r=(window._bpHist||[])[i],t="";r.items.forEach(function(a){t+="<div style=padding:3px 0;font-size:12px><span style=color:#999>"+a.code+"</span> "+a.text+"</div>"});d.innerHTML=t;d.style.display="block"}else d.style.display="none"}
function delBPR(i){if(!confirm("删除？"))return;var h=window._bpHist||[];h.splice(i,1);localStorage.setItem("bp_v5",JSON.stringify(h));renderBPHist()}
