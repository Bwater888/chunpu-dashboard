<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>纯朴渠道-视频号1组</title>
<style>:root{--bg:#f5f6fa;--card:#fff;--side:#0f1724;--pri:#4f46e5;--gr:#10b981;--rd:#ef4444;--or:#f59e0b;--tx:#1a1a2e;--mu:#94a3b8;--bd:#e2e8f0}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--side);min-height:100vh;transition:.3s}
body.logged{background:var(--bg);display:flex}
.lo{position:fixed;inset:0;background:var(--side);display:flex;align-items:center;justify-content:center;z-index:999}
.lb{background:var(--card);border-radius:12px;padding:40px;width:360px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.lb h2{font-size:20px;margin-bottom:4px}.lb p{font-size:12px;color:var(--mu);margin-bottom:24px}
.lb input{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;font-size:14px;margin-bottom:12px;text-align:center}
.lb input:focus{outline:none;border-color:var(--pri)}
.lb .btn{display:block;width:100%;padding:10px;background:var(--pri);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
.sb{width:220px;background:var(--side);color:#fff;display:none;flex-direction:column;position:fixed;left:0;top:0;bottom:0}
.logged .sb{display:flex}
.sb-h{padding:20px;font-size:14px;font-weight:700;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:8px}
.sb-h span{background:var(--pri);width:26px;height:26px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:13px}
.sb-n{flex:1;padding:8px}
.sb-n a{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:13px;color:rgba(255,255,255,.6);text-decoration:none;margin-bottom:2px;transition:.15s}
.sb-n a:hover,.sb-n a.act{background:rgba(79,70,229,.25);color:#fff;font-weight:600}
.sb-f{padding:12px 16px;font-size:11px;color:rgba(255,255,255,.3);border-top:1px solid rgba(255,255,255,.1);display:flex;justify-content:space-between}
.sb-f a{color:rgba(255,255,255,.3);cursor:pointer;text-decoration:none}.sb-f a:hover{color:#fff}
.mn{flex:1;margin-left:220px;padding:20px 24px;display:none;min-height:100vh}
.logged .mn{display:block}
.tb{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.tb h1{font-size:20px;font-weight:700}.tbr{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mu)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}.on{background:var(--gr)}.off{background:var(--rd)}
.card{background:var(--card);border-radius:10px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:12px}
.kr{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.ki{padding:16px;background:var(--card);border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.ki-l{font-size:11px;color:var(--mu);margin-bottom:4px}.ki-v{font-size:28px;font-weight:800}
.cr{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.cw{background:var(--card);border-radius:10px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.cw h3{font-size:11px;color:var(--mu);margin-bottom:8px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:#f8fafc;padding:8px 10px;text-align:left;font-weight:600;color:var(--mu);border-bottom:2px solid var(--bd)}
td{padding:7px 10px;border-bottom:1px solid var(--bd)}tr:hover td{background:#f8fafc}
.ar{text-align:right}.gr{color:var(--gr)}.rd{color:var(--rd)}.mu{color:var(--mu)}
.st{font-size:13px;font-weight:700;color:var(--pri);margin-bottom:8px;padding-bottom:6px;border-bottom:2px solid var(--bd)}
.rw{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
input,select{padding:6px 10px;border:1px solid var(--bd);border-radius:6px;font-size:13px;background:#fff}
input:focus,select:focus{outline:none;border-color:var(--pri)}
.btn-sm{padding:5px 12px;font-size:11px;border-radius:6px;cursor:pointer;font-weight:600;border:none}
.btn-p{background:var(--pri);color:#fff}.btn-o{background:#fff;color:var(--pri);border:1px solid var(--bd)}.btn-g{background:#fff;color:var(--mu);border:1px solid var(--bd)}
.tag{font-size:9px;padding:1px 6px;border-radius:3px;font-weight:600;white-space:nowrap}
.t1{background:#fff0f0;color:#ef4444}.t2{background:#fff7e6;color:#f59e0b}.t3{background:#e6f7ff;color:#3b82f6}
.bp-r{padding:6px 0;border-bottom:1px solid var(--bd);font-size:13px;display:flex;align-items:center;gap:8px}.bp-r:last-child{border-bottom:none}
.bp-img{width:32px;height:32px;object-fit:cover;border-radius:4px;border:1px solid var(--bd)}
.hi{background:#f8fafc;border-radius:8px;padding:10px;margin-bottom:6px}
.toast{position:fixed;top:20px;right:20px;background:var(--side);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:999;animation:in .3s}
@keyframes in{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
</style></head>
<body>
<div class="lo" id="loginBox"><div class="lb"><h2>纯朴渠道-视频号1组</h2><p>仓盈庾亿，年岁有息</p><input type="password" id="pwd" placeholder="输入密码" onkeydown="if(event.key==='Enter')login()"><button class="btn" onclick="login()">进入</button></div></div>
<div class="sb" id="sidebar">
  <div class="sb-h"><span>纯</span>纯朴渠道</div>
  <div class="sb-n">
    <a onclick="nav('dash')" data-nav="dash" class="act">📊 数据看板</a>
    <a onclick="nav('detail')" data-nav="detail">📋 数据明细</a>
    <a onclick="nav('product')" data-nav="product">📈 产品分析</a>
    <a onclick="nav('bp')" data-nav="bp">💬 包评生成</a>
    <a onclick="nav('bphist')" data-nav="bphist">📁 包评历史</a>
    <a onclick="nav('settings')" data-nav="settings">⚙️ 设置</a>
  </div>
  <div class="sb-f"><span id="syncTime">--</span><a onclick="logout()">退出</a></div>
</div>
<div class="mn" id="main">
  <div class="tb"><h1 id="pageTitle">数据看板</h1><div class="tbr"><span class="dot" id="syncDot"></span><span id="syncStatus">离线</span><button class="btn-sm btn-o" onclick="nav(S.cur)">刷新</button></div></div>
  <div id="content"></div>
</div>
<script>
var S={cur:'dash',DB:[],bpData:[]},CMTS=null,SRV='http://10.131.0.168:3000';

function login(){var p=document.getElementById('pwd').value;if(p!=='88888888')return;document.getElementById('loginBox').style.display='none';document.body.classList.add('logged');init()}
function logout(){document.getElementById('loginBox').style.display='';document.body.classList.remove('logged');document.getElementById('pwd').value=''}
function toast(m,t){var d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(function(){d.remove()},t||2000)}
function fm(v,d){d=d||1;if(v==null||isNaN(v))return'--';return Number(v).toLocaleString('zh-CN',{minimumFractionDigits:d,maximumFractionDigits:d})}
function fp(v){if(v==null||isNaN(v))return'--';return(Number(v)*100).toFixed(1)+'%'}

async function init(){
  try{var r=await fetch('comments.json');if(r.ok){var j=await r.json();CMTS=j.comments;document.getElementById('syncTime').textContent='评论:'+j.updated}}catch(e){}
  nav('dash');
}
function nav(t){S.cur=t;document.querySelectorAll('.sb-n a').forEach(function(a){a.classList.toggle('act',a.dataset.nav===t)});var ti={dash:'数据看板',detail:'数据明细',product:'产品分析',bp:'包评生成器',bphist:'包评历史',settings:'设置'};document.getElementById('pageTitle').textContent=ti[t]||t;if(t==='dash')rDash();else if(t==='detail')rDetail();else if(t==='product')rDash();else if(t==='bp')rBP();else if(t==='bphist')rBPHist();else rSet()}

function rDash(){
  var h='<div class=kr>';
  h+='<div class=ki><div class=ki-l>总GMV</div><div class=ki-v style=color:var(--pri)>--</div></div>';
  h+='<div class=ki><div class=ki-l>总消耗</div><div class=ki-v style=color:var(--or)>--</div></div>';
  h+='<div class=ki><div class=ki-l>总利润</div><div class=ki-v style=color:var(--gr)>--</div></div>';
  h+='<div class=ki><div class=ki-l>综合ROI</div><div class=ki-v style=color:var(--pri)>--</div></div></div>';
  h+='<div class=card><div class=st>产品汇总</div><table><thead><tr><th>产品</th><th class=ar>GMV</th><th class=ar>消耗</th><th class=ar>利润</th><th class=ar>ROI</th></tr></thead><tbody>';
  var prod={};S.DB.forEach(function(d){var p=d.product;if(!prod[p])prod[p]={g:0,s:0,p:0};prod[p].g+=d.总成交金额||d.gmv||0;prod[p].s+=d.总消耗||0;prod[p].p+=d.利润||0});
  if(Object.keys(prod).length===0){h+='<tr><td colspan=5 style=text-align:center;color:var(--mu);padding:20px>暂无数据 — 请配置后端服务</td></tr>'}
  else Object.keys(prod).forEach(function(p){var d=prod[p];h+='<tr><td><b>'+p+'</b></td><td class=ar>'+fm(d.g)+'</td><td class=ar>'+fm(d.s)+'</td><td class="ar '+(d.p>=0?'gr':'rd')+'">'+fm(d.p,2)+'</td><td class=ar>'+fm(d.s>0?d.g/d.s:0)+'</td></tr>'});
  h+='</tbody></table></div>';
  document.getElementById('content').innerHTML=h;
}
function rDetail(){document.getElementById('content').innerHTML='<div class=card><div class=st>数据明细</div><p style=color:var(--mu)>数据从后端加载</p></div>'}
function rSet(){document.getElementById('content').innerHTML='<div class=card><div class=st>设置</div><p>后端: '+SRV+'</p></div>'}

// BP
var bpSt={冷启动:{t:7,t1:.5,t2:.35,t3:.1,t4:.05},爬坡期:{t:9,t1:.45,t2:.38,t3:.12,t4:.05},爆发期:{t:11,t1:.48,t2:.32,t3:.15,t4:.05},稳定期:{t:7,t1:.35,t2:.35,t3:.2,t4:.1}};
function rBP(){
  var h='<div class=card><div class=st>包评生成器</div>';
  h+='<div class=rw><label>素材ID</label><input id=bpCid style=width:160px><label>产品</label><select id=bpProd><option value="">选产品</option><option>贴贴霜</option><option>泥膜</option><option>防脱</option><option>粉底液</option></select><label>阶段</label><select id=bpStage><option>冷启动</option><option>爬坡期</option><option>爆发期</option><option>稳定期</option></select></div>';
  h+='<div class=rw><label>总条数</label><input type=number id=bpTotal value=7 min=1 max=20 style=width:70px><button class="btn-sm btn-p" onclick=genBP()>生成包评单</button></div><div id=bpResult></div>';
  if(!CMTS)h+='<div style=color:var(--or);font-size:11px;margin-top:8px>未连接评论库</div>';
  h+='</div>';
  document.getElementById('content').innerHTML=h;
  document.getElementById('bpStage').onchange=function(){var s=this.value;if(bpSt[s])document.getElementById('bpTotal').value=bpSt[s].t};
}
function genBP(){
  if(!CMTS){alert('评论库未加载');return}
  var cid=document.getElementById('bpCid').value.trim(),prod=document.getElementById('bpProd').value,stage=document.getElementById('bpStage').value,total=parseInt(document.getElementById('bpTotal').value)||7;
  if(!cid||!prod){alert('填素材ID+产品');return}
  var cm=CMTS[prod];if(!cm){alert('该产品暂无评论');return}
  var st=bpSt[stage]||bpSt.冷启动;
  var all=[];Object.keys(cm).forEach(function(k){all.push({code:k,cmts:cm[k],prio:cm[k][0].prio})});all.sort(function(a,b){return a.prio.localeCompare(b.prio)});
  var ts={1:[],2:[],3:[],4:[]};all.forEach(function(s){ts[parseInt(s.prio.split(' ')[0])].push(s)});
  var al=[];
  function fl(l,c){if(!l||l.length===0)return;var p=Math.floor(c/l.length),r=c%l.length;l.forEach(function(s,i){var n=i<r?p+1:p;for(var j=0;j<n&&j<s.cmts.length;j++)al.push({code:s.code,text:s.cmts[j].text,prio:s.prio,idx:j,img:s.cmts[j].img||''})})}
  fl(ts[1],Math.round(total*st.t1));fl(ts[2],Math.round(total*st.t2));fl(ts[3],Math.round(total*st.t3));
  var l4=total-Math.round(total*st.t1)-Math.round(total*st.t2)-Math.round(total*st.t3);fl(ts[4],l4);
  var used=[];S.bpData.forEach(function(r){if(r.cid===cid)r.items.forEach(function(x){used.push(x.text)})});
  al.forEach(function(a){if(used.indexOf(a.text)>=0){var c=cm[a.code];for(var k=0;k<c.length;k++){if(used.indexOf(c[k].text)<0){a.text=c[k].text;a.idx=k;a.img=c[k].img||'';break}}}used.push(a.text)});
  var items=al.map(function(a){return{code:a.code,text:a.text,prio:a.prio,idx:a.idx,img:a.img}});
  var h='<div style=margin-top:12px><b>素材 '+cid+' | '+prod+' | '+stage+'</b> <span class=mu style=font-size:12px>'+items.length+'条</span>';
  items.forEach(function(a,i){var t=parseInt(a.prio.split(' ')[0]);h+='<div class=bp-r><span style=width:36px;font-size:10px;color:var(--mu)>'+a.code+'</span><span class="tag t'+t+'">'+a.prio.split(' ').slice(1).join(' ')+'</span><span style=flex:1>'+a.text+'</span>';if(a.img)h+='<img class=bp-img src='+(a.img.indexOf('http')===0?a.img:'images/'+a.img)+' onerror=this.style.display=none>';h+='<button class=btn-sm style=background:var(--pri);color:#fff;font-size:10px;padding:3px 8px;white-space:nowrap onclick=cpBP('+i+')>复制</button></div>'});
  h+='<div style=margin-top:8px><button class="btn-sm btn-p" onclick=saveBP()>保存到历史</button></div></div>';
  document.getElementById('bpResult').innerHTML=h;
  window._bi=items;window._bc=cid;window._bp=prod;window._bs=stage;
}
function cpBP(i){var a=window._bi[i];if(!a)return;var d=document.createElement('div');d.contentEditable=true;d.style.position='fixed';d.style.left='-9999px';if(a.img)d.innerHTML=a.text+'<br><img src='+(a.img.indexOf('http')===0?a.img:'images/'+a.img)+' style=max-width:300px>';else d.textContent=a.text;document.body.appendChild(d);var r=document.createRange();r.selectNodeContents(d);var s=window.getSelection();s.removeAllRanges();s.addRange(r);document.execCommand('copy');s.removeAllRanges();document.body.removeChild(d);toast('已复制')}
function saveBP(){if(!window._bi)return;var e={cid:window._bc,prod:window._bp,stage:window._bs,time:new Date().toLocaleString('zh-CN'),items:window._bi};var x=-1;for(var i=0;i<S.bpData.length;i++){if(S.bpData[i].cid===e.cid){x=i;break}}if(x>=0)S.bpData[x]=e;else S.bpData.unshift(e);if(S.bpData.length>200)S.bpData=S.bpData.slice(0,200);localStorage.setItem('bp_v2',JSON.stringify(S.bpData));toast('已保存');rBPHist()}

function rBPHist(){
  var h='<div class=card><div class=st>包评历史 ('+S.bpData.length+'条)</div>';
  if(S.bpData.length===0)h+='<div style=color:var(--mu);text-align:center;padding:20px>暂无记录</div>';
  else S.bpData.forEach(function(r,i){h+='<div class=hi><div style=display:flex;justify-content:space-between><b>'+r.cid+'</b><span style=font-size:10px;color:var(--mu)>'+r.time+'</span></div><div style=font-size:11px;color:var(--mu)>'+r.prod+' | '+r.stage+' | '+r.items.length+'条</div><div style=font-size:11px;color:#666;overflow:hidden;white-space:nowrap;text-overflow:ellipsis>'+r.items.map(function(t){return t.text}).join(' | ')+'</div><div style=margin-top:4px><button class="btn-sm btn-o" style=font-size:10px;padding:2px 8px onclick=togBP('+i+')>详情</button> <button style=font-size:10px;padding:2px 8px;background:var(--rd);color:#fff;border:none;border-radius:4px;cursor:pointer onclick=delBP('+i+')>删除</button></div><div id=bpd_'+i+' style=display:none;margin-top:6px;padding:8px;background:#fff;border-radius:6px></div></div>'});
  h+='</div>';
  document.getElementById('content').innerHTML=h;
}
function togBP(i){var d=document.getElementById('bpd_'+i);if(d.style.display==='none'){var r=S.bpData[i],ht='';r.items.forEach(function(a){ht+='<div style=padding:3px 0;font-size:12px><span class=mu>'+a.code+'</span> '+a.text+'</div>'});d.innerHTML=ht;d.style.display='block'}else d.style.display='none'}
function delBP(i){if(!confirm('删除？'))return;S.bpData.splice(i,1);localStorage.setItem('bp_v2',JSON.stringify(S.bpData));rBPHist()}

// Load saved bp data
try{S.bpData=JSON.parse(localStorage.getItem('bp_v2'))||[]}catch(e){}

init();
</script></body></html>
