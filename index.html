<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>纯朴渠道-视频号1组</title><style>
:root{--void:#050508;--surf:#0d0d15;--surf2:#141420;--amber:#e8a838;--phos:#4ee8a8;--coral:#f06060;--ice:#60c8f0;--txt:#e0dcd0;--dim:#6e6456;--line:#1c1c2a;--line2:#252535}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--void);color:var(--txt);font-family:"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}
.logo{position:fixed;inset:0;background:var(--void);display:flex;align-items:center;justify-content:center;z-index:999;background-image:radial-gradient(circle,rgba(28,28,42,.8) 1px,transparent 1px);background-size:16px 16px}
.lb{background:var(--surf);border:1px solid var(--line2);padding:52px 44px;width:400px;text-align:center}
.lb h2{font-size:20px;font-weight:800;letter-spacing:4px;color:var(--txt);margin-bottom:8px}
.lb p{font-size:11px;color:var(--dim);letter-spacing:4px;margin-bottom:28px}
.lb input{width:100%;padding:12px;background:var(--void);border:1px solid var(--line);font-size:18px;text-align:center;color:var(--amber);letter-spacing:6px;margin-bottom:16px}
.lb input:focus{outline:none;border-color:var(--amber)}
.lb button{display:block;width:100%;padding:12px;background:transparent;color:var(--amber);border:1px solid var(--amber);font-size:14px;font-weight:700;cursor:pointer;letter-spacing:4px}
.lb button:hover{background:rgba(232,168,56,.1)}
.lb .err{color:var(--coral);font-size:11px;min-height:18px;margin-top:-8px}
.logged .logo{display:none}
.sb{width:224px;background:var(--surf);position:fixed;left:0;top:0;bottom:0;display:none;flex-direction:column;z-index:100;border-right:1px solid var(--line)}
.logged .sb{display:flex}
.sb-h{padding:18px;font-size:14px;font-weight:700;border-bottom:1px solid var(--line);letter-spacing:2px;display:flex;align-items:center;gap:10px}
.sb-h span{background:var(--amber);color:var(--void);width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
.sb-n{flex:1;padding:10px 8px;overflow-y:auto}
.sb-n div{padding:10px 12px;cursor:pointer;font-size:12px;color:var(--dim);margin-bottom:1px;border-left:2px solid transparent;transition:all .15s}
.sb-n div:hover{color:var(--txt);background:var(--surf2)}
.sb-n div.ac{color:var(--amber);border-left-color:var(--amber);background:var(--surf2)}
.sb-f{padding:12px 14px;font-size:10px;color:var(--dim);border-top:1px solid var(--line);display:flex;justify-content:space-between}
.sb-f a{color:var(--dim);cursor:pointer}.sb-f a:hover{color:var(--amber)}
.mn{margin-left:224px;display:none;min-height:100vh;background:var(--void);background-image:radial-gradient(circle,rgba(28,28,42,.6) 1px,transparent 1px);background-size:16px 16px}
.logged .mn{display:block}
.app{padding:24px}
h1{color:var(--amber);font-size:18px;margin-bottom:16px;letter-spacing:2px}
.card{background:var(--surf);border:1px solid var(--line);padding:20px;margin-bottom:14px}
th{background:var(--surf2);color:var(--dim);padding:8px 10px;border-bottom:1px solid var(--line);font-size:10px;text-align:left}
td{padding:6px 10px;border-bottom:1px solid var(--line);font-size:11px}
table{width:100%;border-collapse:collapse}
.ar{text-align:right}.ac{text-align:center}
</style></head><body>
<div class="logo"><div class="lb"><h2>纯朴渠道-视频号1组</h2><p>仓盈庾亿 年岁有息</p><input type="password" id="pwd" placeholder="ACCESS"><div class="err" id="err"></div><button onclick="doLogin()">进入</button></div></div>
<div class="sb" id="sidebar"><div class="sb-h"><span>纯</span>纯朴渠道</div><div class="sb-n"><div class="ac" onclick="showTab('dash')">📊 数据看板</div><div onclick="showTab('bp')">💬 包评生成</div></div><div class="sb-f"><a onclick="doLogout()">退出</a></div></div>
<div class="mn" id="main"><div class="app"><div id="dash"><h1>◈ 量子终端</h1><div class="card"><div id="dashContent"><p style="color:var(--dim)">数据加载中...</p></div></div></div><div id="bp" style="display:none"><h1>◈ 包评生成器</h1><div class="card"><p style="color:var(--dim)">评论库加载中...</p></div></div></div></div>
<script>
function doLogin(){var p=document.getElementById("pwd").value;if(p!=="88888888"){document.getElementById("err").textContent="ACCESS DENIED";return}document.body.classList.add("logged")}
function doLogout(){document.body.classList.remove("logged")}
function showTab(t){document.querySelectorAll(".sb-n div").forEach(function(d){d.classList.toggle("ac",d.textContent.indexOf(t==="dash"?"看板":"包评")>=0)});document.getElementById("dash").style.display=t==="dash"?"block":"none";document.getElementById("bp").style.display=t==="bp"?"block":"none"}
</script></body></html>
